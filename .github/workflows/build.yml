name: Build

on:
  push:
  pull_request:
  schedule:
    # Weekly build so the floating DMXCore.PluginSdk 1.* reference surfaces
    # breakage from new SDK releases even when this repo is idle.
    - cron: '15 6 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/DMXCore100.ExamplePlugin.Tests --configuration Release

      - name: Build and pack
        run: ./pack.sh

      - uses: actions/upload-artifact@v7
        with:
          name: example-plugin
          path: |
            artifacts/*.dmxplugin
            artifacts/*.nupkg

      # Plugin registry: nuget.org is where DMX Core 100 devices browse,
      # install and update plugins from, so pushing here IS the release.
      # --skip-duplicate makes re-pushing an already published version a
      # no-op, so bumping <Version> in the csproj is what publishes.
      - name: Publish to nuget.org
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pkg=$(ls artifacts/*.nupkg | head -1)
          # A package pushed to nuget.org can never be deleted, so refuse a
          # package that lacks the plugin payload (built with an SDK that
          # predates registry packaging, or a broken pack).
          if ! unzip -l "$pkg" | grep -q 'content/plugin.dmxplugin'; then
            echo "::error::$pkg lacks content/plugin.dmxplugin - not a DmxCorePlugin package"
            exit 1
          fi
          dotnet nuget push "$pkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --skip-duplicate

      # Workflow artifacts expire; keep a permanent, anonymously downloadable
      # copy of the current build as a single rolling release. Recreated (not
      # appended) so the "latest" tag always points at the built commit.
      - name: Update rolling latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Update in place instead of delete+recreate: a product build that
          # downloads the "latest release" mid-update must never find no
          # release at all.
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest artifacts/*.dmxplugin --clobber
            gh release edit latest --draft=false --notes "Automatically packaged from \`${GITHUB_SHA}\`."
            git tag -f latest "${GITHUB_SHA}"
            git push -f origin latest
          else
            # A normal (non-prerelease) release: the DMX Core 100 product
            # build downloads it with DownloadGitHubRelease's "latest
            # release" mode, which skips prereleases.
            gh release create latest artifacts/*.dmxplugin \
              --title "Latest build" \
              --notes "Automatically packaged from \`${GITHUB_SHA}\`."
          fi

      # Permanent, versioned release history: created once per manifest
      # version (the first main build carrying a new version publishes it),
      # never modified afterwards. The rolling 'latest' above remains what
      # the DMX Core 100 product build bundles.
      - name: Publish versioned release (once per version)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version "$(find src -name manifest.json | head -1)")
          if ! gh release view "v${version}" > /dev/null 2>&1; then
            gh release create "v${version}" artifacts/*.dmxplugin --title "v${version}" --notes "Version ${version}, packaged from commit ${GITHUB_SHA}."
          fi
