name: Build

on:
  push:
  pull_request:
  schedule:
    # Weekly build so the floating DMXCore.PluginSdk 0.* reference surfaces
    # breakage from new SDK releases even when this repo is idle.
    - cron: '15 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and pack
        run: ./pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: example-plugin
          path: artifacts/*.dmxplugin
