name: Build

on:
  push:
  pull_request:
  schedule:
    # Weekly build so the floating DMXCore.PluginSdk 0.* reference surfaces
    # breakage from new SDK releases even when this repo is idle.
    - cron: '15 6 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/DMXCore100.ExamplePlugin.Tests --configuration Release

      - name: Build and pack
        run: ./pack.sh

      - uses: actions/upload-artifact@v7
        with:
          name: example-plugin
          path: artifacts/*.dmxplugin

      # Workflow artifacts expire; keep a permanent, anonymously downloadable
      # copy of the current build as a single rolling release. Recreated (not
      # appended) so the "latest" tag always points at the built commit.
      - name: Update rolling latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest artifacts/*.dmxplugin \
            --title "Latest build" \
            --prerelease \
            --notes "Automatically packaged from \`${GITHUB_SHA}\`. The plugin SDK is 0.x preview; host-side plugin loading ships in a future DMX Core 100 release."
